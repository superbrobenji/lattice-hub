version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  - package-ecosystem: gomod
    directory: /server/orchestrator
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go

  - package-ecosystem: gomod
    directory: /server/sidecar
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /server/dashboard
    schedule:
      interval: weekly
    labels:
      - dependencies
      - npm
    groups:
      react:
        # react and react-dom must stay on the exact same version (React 19
        # throws "Incompatible React versions" and the SSR server hangs/crashes
        # if they drift apart) — keep them in one atomic PR.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router*"
          - "@react-router/*"

  - package-ecosystem: npm
    directory: /server/artist-portal
    schedule:
      interval: weekly
    labels:
      - dependencies
      - npm
    groups:
      react:
        # See server/dashboard block above — same lockstep requirement applies.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router*"
          - "@react-router/*"
