syntax = "proto3";
package mesh;

option go_package = "github.com/superbrobenji/motionServer/mesh";

message MeshMessage {
  uint32 messageType       = 1;  // 0=ADAPTER_DATA, 1=MASTER_BEACON, 2=ENROLLMENT, 3=SERIAL_CMD_BROADCAST (server→device), 4=JOIN_ACK (server→device)
  sint32 dataType          = 2;  // zigzag: -1=UNKNOWN, 0=PIR, 1=WIFI, 2=LED, 3=SERIAL
  bytes  originMacAddress  = 3;  // 6 bytes
  bytes  targetMacAddress  = 4;  // 6 bytes
  bytes  lastHopMacAddress = 5;  // 6 bytes
  bytes  data              = 6;  // up to 64 bytes
  uint32 hopCount          = 7;
  uint32 epochNum          = 8;  // sender boot epoch (was field 9 — CORRECTED to match firmware)
  uint32 seqNum            = 9;  // per-boot sequence counter (was field 10 — CORRECTED)
  uint32 protoVersion      = 10; // must be 1 for v1 messages (was field 8 — CORRECTED)
  bytes  public_key        = 11; // enrollment/join_ack: 32-byte Curve25519 public key
  optional uint32 routeLen          = 12; // v3: relay path length (header field)
  optional bytes  routePath         = 13; // v3: relay MACs — routeLen × 6 bytes, forward order (48 = MAX_HOPS(8) × 6, v6)
  optional bytes  authTag           = 14; // v3: ChaCha20-Poly1305 tag over data[64] (firmware-only)
  // v6 (wire shrink): fields 15/16 (secondaryMasterMac, secondaryPublicKey) removed.
  // JOIN_ACK now packs secondary master identity into data[4..42] instead — see
  // ApproveEnrollment. Field numbers 15/16 are retired, not reused.
  optional bytes  authPath           = 17; // v4: chained HMAC-SHA256-64 over route_path (8 bytes), firmware-authored, master-verified; opaque to hub
}
