# Native-orchestrator overlay — for hosts where Docker cannot reach the serial
# device (Docker Desktop on macOS). The orchestrator runs natively on the host
# (docs/macos_native_dev.md, Step 5); everything else stays in Docker and reaches
# it through the host gateway under the same `orchestrator` hostname, so
# ORCHESTRATOR_URL needs no change.
# Requires Docker Compose v2.17+ (!reset YAML tag).
# Use: make native, or
#   docker compose -f docker-compose.yml -f docker-compose.native.yml up -d

services:
  orchestrator:
    # Parked behind a profile so `up` skips the container instead of failing
    # on the missing /dev/ttyUSB0 device.
    profiles: ["docker-orchestrator"]

  dashboard:
    # The orchestrator container never becomes healthy here; drop the wait.
    depends_on: !reset []
    extra_hosts:
      - "orchestrator:host-gateway"

  artist-portal:
    extra_hosts:
      - "orchestrator:host-gateway"
